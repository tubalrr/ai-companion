<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account • AI Companion</title>
<link rel="stylesheet" href="../assets/css/style.css"><style>.page{min-height:100vh;display:grid;place-items:center;padding:20px;background:#080a12;color:#fff}.card{width:min(420px,100%);padding:32px;border:1px solid #ffffff15;border-radius:24px;background:#151927e8;box-shadow:0 30px 90px #0008}.card h1{text-align:center}.card input{box-sizing:border-box;width:100%;margin:8px 0;padding:13px;border-radius:11px;border:1px solid #ffffff12;background:#0d101a;color:#fff}.card button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;cursor:pointer}.secondary{display:block;margin-top:15px;color:#9ea5ba;text-align:center;text-decoration:none;font-size:12px}.error{min-height:18px;margin-top:12px;color:#fb7185;font-size:12px;text-align:center}</style></head>
<body class="dark"><main class="page"><section class="card"><h1>Create account</h1><input id="name" maxlength="40" placeholder="Display name" autocomplete="name"><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" autocomplete="new-password"><button id="signup">Create account</button><p id="error" class="error"></p><a class="secondary" href="login.html">Already have an account? Log in</a><a class="secondary" href="../index.html">← Back to AI Companion</a></section></main>
<script>
const error=document.getElementById("error");
document.getElementById("signup").onclick=async()=>{
 error.textContent="";
 const displayName=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||password.length<8){error.textContent="Enter a valid email and password with at least 8 characters.";return}
 try{
  const r=await fetch("../api/auth/register",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({displayName,email,password})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||"Registration failed");
  location.href="../index.html";
 }catch(e){error.textContent=e.message}
};
</script></body></html>
