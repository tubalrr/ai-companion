<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Library • AI Companion</title><link rel="stylesheet" href="../assets/css/library.css"><link rel="stylesheet" href="../assets/css/theme.css"></head><body><div class="orb one"></div><div class="orb two"></div><main class="library"><header><div><a href="../index.html" class="back">← Back</a><div class="title"><span>▣</span><div><small>AI COMPANION</small><h1>Library</h1></div></div><p>Your personal space for files, images, documents and saved prompts.</p></div><button id="uploadBtn" class="upload">＋ Upload</button></header><div class="toolbar"><label>⌕ <input id="search" placeholder="Search library..."></label><div class="views"><button class="active" data-view="grid">▦</button><button data-view="list">☷</button></div></div><nav><button class="active" data-filter="all">All <b id="allCount">0</b></button><button data-filter="files">Files <b id="fileCount">0</b></button><button data-filter="images">Images <b id="imageCount">0</b></button><button data-filter="prompts">Prompts <b id="promptCount">0</b></button></nav><section id="drop" class="drop"><strong>↑ Drop files here</strong><span>or click Upload to add files to your local library</span></section><section class="content"><div class="section-head"><div><h2 id="heading">All items</h2><small id="result">0 items</small></div><button id="clear">Clear library</button></div><div id="empty" class="empty"><div>✦</div><h3>Your library is empty</h3><p>Upload something to start building your library.</p></div><div id="items" class="items"></div></section><input id="fileInput" type="file" multiple hidden><div id="promptModal" class="modal"><div class="modal-card"><button id="closePrompt" class="close">×</button><h2>Save prompt</h2><input id="promptTitle" placeholder="Prompt name"><textarea id="promptText" placeholder="Write your prompt here..."></textarea><button id="savePrompt" class="upload">Save prompt</button></div></div><div id="toast"></div></main><script src="../assets/js/library.js"></script></body></html>
