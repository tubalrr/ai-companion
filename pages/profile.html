<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b0d16"><title>Profile • AI Companion</title><link rel="stylesheet" href="../assets/css/style.css"><style>
.profile-page{min-height:100vh;padding:32px;background:radial-gradient(circle at 75% 15%,rgba(120,90,255,.18),transparent 30%),radial-gradient(circle at 25% 85%,rgba(0,220,190,.08),transparent 28%);display:grid;place-items:center}.profile-shell{width:min(760px,100%);background:#151927e8;border:1px solid #ffffff15;border-radius:28px;overflow:hidden;box-shadow:0 30px 100px #0009;backdrop-filter:blur(25px)}.profile-head{height:170px;background:radial-gradient(circle at 25% 20%,#8b6cff99,transparent 40%),linear-gradient(135deg,#181b30,#0d1820);position:relative}.back{position:absolute;top:20px;left:20px;border:1px solid #ffffff15;background:#ffffff0b;color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer}.profile-main{padding:0 42px 42px;text-align:center}.account-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0 26px}.account-menu button{border:1px solid #ffffff12;background:#ffffff06;color:#dce0ee;border-radius:12px;padding:11px 8px;cursor:pointer;font:inherit;font-size:12px}.account-menu button:hover{background:#ffffff0d;border-color:#8b6cff55}.account-menu span{margin-left:4px}.account-menu button:last-child{grid-column:1/-1;text-align:left;padding-left:14px}.account-menu button:last-child.logged{color:#ff9aa6}@media(max-width:600px){.account-menu{grid-template-columns:1fr 1fr}.account-menu button:last-child{grid-column:1/-1}}.big-avatar{width:130px;height:130px;margin:-65px auto 16px;border:5px solid #151927;border-radius:38px;background:linear-gradient(135deg,#8b6cff,#35ddc0);display:grid;place-items:center;overflow:hidden;color:#fff;font-size:40px;font-weight:700;box-shadow:0 15px 45px #0008}.big-avatar img{width:100%;height:100%;object-fit:cover;display:none}.photo-btn{margin:0 auto 18px;border:1px solid #ffffff15;background:#ffffff08;color:#dce0ee;padding:9px 14px;border-radius:11px;cursor:pointer}.profile-main h1{margin:8px 0 5px}.sub{color:#858ba0;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:left;margin-top:30px}.field{color:#aeb4c7;font-size:12px}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;margin-top:7px;padding:13px;border-radius:12px;border:1px solid #ffffff12;background:#0d101a;color:#fff;outline:0;font:inherit}.field textarea{min-height:100px;resize:vertical}.save{margin-top:22px;width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#fff,#d9d8ff);color:#111;font-weight:700;cursor:pointer}.notice{font-size:11px;color:#6f7689;margin-top:10px}@media(max-width:600px){.profile-page{padding:14px}.profile-main{padding:0 20px 25px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body class="dark"><div class="profile-page"><section class="profile-shell"><div class="profile-head"><button class="back" id="back">← Back</button></div><div class="profile-main"><div class="account-menu"><button onclick="location.href='settings.html'">⚙ <span>Settings</span></button><button onclick="location.href='upgrade.html'">✦ <span>Upgrade plan</span></button><button onclick="location.href='help.html'">?</button><button onclick="location.href='help.html'">❔ <span>Help</span></button><button id="authAction">↪ <span>Log in</span></button></div><div class="big-avatar"><span id="initials">AI</span><img id="photo" alt="Profile photo"></div><input id="photoInput" type="file" accept="image/*" hidden><button class="photo-btn" id="changePhoto">Change profile photo</button><h1 id="heading">AI User</h1><p class="sub">Your AI Companion profile</p><div class="fields"><label class="field">Display name<input id="name" maxlength="40" placeholder="Your name"></label><label class="field">AI Personality<input id="persona" readonly></label><label class="field full">About me<textarea id="about" maxlength="300" placeholder="Tell something about yourself"></textarea></label></div><button class="save" id="save">Save profile</button><p class="notice">Account authentication is handled by the secure backend. Optional profile fields remain local until cloud profile storage is enabled.</p></div></section></div><script>
const nameEl=document.getElementById("name"),aboutEl=document.getElementById("about"),personaEl=document.getElementById("persona"),photo=document.getElementById("photo"),initials=document.getElementById("initials"),heading=document.getElementById("heading"),input=document.getElementById("photoInput");
function load(){const n=localStorage.getItem("aiProfileName")||"AI User",a=localStorage.getItem("aiProfileAbout")||"",p=localStorage.getItem("aiProfilePhoto")||"",persona=localStorage.getItem("aiPersona")||"Friendly",theme=localStorage.getItem("aiTheme")||"dark";nameEl.value=n;aboutEl.value=a;personaEl.value=persona;heading.textContent=n;initials.textContent=n.slice(0,2).toUpperCase();document.body.className=theme;if(p){photo.src=p;photo.style.display="block";initials.style.display="none"}else{photo.style.display="none";initials.style.display="block"}}
document.getElementById("changePhoto").onclick=()=>input.click();input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem("aiProfilePhoto",r.result);load()};r.readAsDataURL(f)};
document.getElementById("save").onclick=()=>{localStorage.setItem("aiProfileName",nameEl.value.trim()||"AI User");localStorage.setItem("aiProfileAbout",aboutEl.value.trim());load();alert("Profile saved.")};
const authAction=document.getElementById("authAction");
async function getMe(){
  try{
    const r=await fetch("../api/auth/me",{credentials:"include"});
    if(!r.ok) return null;
    const data=await r.json();
    return data.user||null;
  }catch{return null}
}
async function updateAuth(){
  const user=await getMe();
  const logged=!!user;
  authAction.innerHTML=logged?"↪ <span>Log out</span>":"↪ <span>Log in</span>";
  authAction.classList.toggle("logged",logged);
  if(user){
    const n=user.display_name||"AI User";
    nameEl.value=n; heading.textContent=n; initials.textContent=n.slice(0,2).toUpperCase();
    localStorage.setItem("aiProfileName",n);
  }
  return user;
}
authAction.onclick=async()=>{
  const user=await getMe();
  if(user){
    try{await fetch("../api/auth/logout",{method:"POST",credentials:"include"});}catch{}
    location.href="../index.html";
  }else location.href="login.html";
};
document.getElementById("back").onclick=()=>window.location.href="../index.html";
load(); updateAuth();
</script></body></html>
