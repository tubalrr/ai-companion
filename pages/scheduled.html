<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scheduled • AI Companion</title><link rel="stylesheet" href="../assets/css/scheduled.css"><link rel="stylesheet" href="../assets/css/theme.css"></head>
<body><div class="orb one"></div><div class="orb two"></div><main class="page">
<header><a class="back" href="../index.html">← Back</a><div class="heading"><div class="icon">◷</div><div><small>AI COMPANION</small><h1>Scheduled</h1><p>Plan reminders and scheduled tasks in one place.</p></div></div></header>
<section class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="upcoming">0</b><span>Upcoming</span></div><div><b id="overdue">0</b><span>Overdue</span></div></section>
<section class="create"><div class="create-title"><span class="eyebrow">NEW SCHEDULE</span><h2>What should happen later?</h2></div><input id="taskName" placeholder="Task or reminder" maxlength="120"><div class="row"><input id="taskTime" type="datetime-local"><select id="repeat"><option value="once">Once</option><option value="daily">Every day</option><option value="weekly">Every week</option></select><button id="addTask" class="primary">＋ Schedule</button></div></section>
<section class="toolbar"><label>⌕ <input id="search" placeholder="Search scheduled tasks..."></label><select id="filter"><option value="all">All</option><option value="upcoming">Upcoming</option><option value="overdue">Overdue</option><option value="done">Completed</option></select></section>
<section id="tasks" class="tasks"></section>
</main><div id="toast"></div><script src="../assets/js/scheduled.js"></script></body></html>
