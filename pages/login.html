<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • AI Companion</title>
<link rel="stylesheet" href="../style.css">
<style>.page{min-height:100vh;display:grid;place-items:center;padding:20px;background:#080a12;color:#fff}.card{width:min(420px,100%);padding:32px;border:1px solid #ffffff15;border-radius:24px;background:#151927e8;box-shadow:0 30px 90px #0008}.card h1{text-align:center}.card input{box-sizing:border-box;width:100%;margin:8px 0;padding:13px;border-radius:11px;border:1px solid #ffffff12;background:#0d101a;color:#fff}.card button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;cursor:pointer}.secondary{display:block;margin-top:15px;color:#9ea5ba;text-align:center;text-decoration:none;font-size:12px}.error{min-height:18px;margin-top:12px;color:#fb7185;font-size:12px;text-align:center}</style>
</head><body class="dark"><main class="page"><section class="card"><h1>Welcome back</h1><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Log in</button><p id="error" class="error"></p><a class="secondary" href="signup.html">Create a real account</a><a class="secondary" href="../index.html">← Back to AI Companion</a></section></main>
<script>
const error=document.getElementById("error");
document.getElementById("login").onclick=async()=>{
 error.textContent="";
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password){error.textContent="Enter your email and password.";return}
 try{
  const r=await fetch("../api/auth/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||"Login failed");
  const returnTo=new URLSearchParams(location.search).get("return"); location.href=returnTo ? "../"+returnTo.replace(/^\/+/, "") : "../index.html";
 }catch(e){error.textContent=e.message}
};
</script></body></html>
