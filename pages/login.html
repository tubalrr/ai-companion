<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • AI Companion</title><link rel="stylesheet" href="../css/style.css"><style>.page{min-height:100vh;display:grid;place-items:center;padding:20px;background:#080a12;color:#fff}.card{width:min(420px,100%);padding:32px;border:1px solid #ffffff15;border-radius:24px;background:#151927e8;box-shadow:0 30px 90px #0008}.card h1{text-align:center}.card input{width:100%;margin:8px 0;padding:13px;border-radius:11px;border:1px solid #ffffff12;background:#0d101a;color:#fff}.card button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;cursor:pointer}.back{display:block;margin-top:15px;color:#9ea5ba;text-align:center;text-decoration:none;font-size:12px}</style></head><body class="dark"><main class="page"><section class="card"><h1>Welcome back</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Log in</button><a class="back" href="profile.html">← Back to Profile</a></section></main></body><script>document.getElementById("login").onclick=()=>{if(!document.getElementById("email").value||!document.getElementById("password").value){alert("Enter your email and password.");return}localStorage.setItem("aiLoggedIn","true");location.href="profile.html"};</script></html>
