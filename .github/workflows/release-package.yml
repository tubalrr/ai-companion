name: Build Commercial Release Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION_VALUE"
          echo "Building AI Companion v$VERSION_VALUE"

      - name: Create clean release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          PACKAGE_DIR="release-package"
          ZIP_NAME="AI-Companion-v${VERSION_VALUE}.zip"

          rm -rf "$PACKAGE_DIR" "$ZIP_NAME"
          mkdir -p "$PACKAGE_DIR"

          rsync -a ./ "$PACKAGE_DIR/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='release-package/' \
            --exclude='*.log' \
            --exclude="$ZIP_NAME"

          test -f "$PACKAGE_DIR/VERSION"
          test -f "$PACKAGE_DIR/index.html"

          zip -qr "$ZIP_NAME" "$PACKAGE_DIR"

          test -s "$ZIP_NAME"
          echo "Created $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v${{ github.ref_name }}-package
          path: AI-Companion-v*.zip
          if-no-files-found: error
          retention-days: 14
