<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b0d16"><title>AI Companion</title><link rel="stylesheet" href="style.css"></head>
<body><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="app">
<aside class="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><b>AI Companion</b><small>Your personal AI space</small></div></div>
<button class="new-chat" id="newChat">＋ New chat</button><div class="side-title">RECENT</div><div id="history" class="history"></div>
<div class="sidebar-bottom"><button id="settingsBtn">⚙ Settings</button><button id="themeBtn">◐ Theme</button><button id="exportBtn">⇩ Export chat</button></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="mobile-brand">✦ AI Companion</div><div class="top-actions"><span class="status"><i></i> Online</span><button id="personaBtn" class="pill">🤖 Friendly</button><button class="avatar">AI</button></div></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="ai-avatar">✦</div><div class="eyebrow">YOUR PERSONAL AI</div><h1>Meet your AI Companion</h1><p>Talk, create, learn, plan, or simply have a conversation.</p><div class="suggestions"><button data-msg="Help me plan my day">☀ Plan my day</button><button data-msg="Give me a creative idea">✦ Get creative</button><button data-msg="Teach me something interesting">◈ Teach me</button><button data-msg="Help me write something">✍ Help me write</button></div></div></section>
<div class="composer-wrap"><div id="filePreview" class="file-preview"></div><div class="composer"><button class="icon-btn" id="attach" title="Attach file">＋</button><input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.doc,.docx"><textarea id="message" rows="1" placeholder="Message your AI Companion..." autocomplete="off"></textarea><button class="icon-btn" id="voice" title="Voice input">🎙</button><button class="send" id="send" title="Send">➤</button></div><div class="hint">Enter to send • Shift + Enter for a new line</div></div></main></div>
<div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal">×</button><h2>AI Companion Settings</h2><label>Personality<select id="persona"><option>Friendly</option><option>Professional</option><option>Tutor</option><option>Creative</option><option>Coding</option></select></label><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="amoled">AMOLED</option></select></label><button class="primary" id="saveSettings">Save settings</button></div></div>
<script src="script.js"></script></body></html>
