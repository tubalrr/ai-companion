<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>AI Companion</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.svg">
<meta name="application-name" content="AI Companion">
<link rel="stylesheet" href="style.css?v=20260922-rebuild">
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="ambient ambient-c"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><img src="assets/logo.svg" alt="AI Companion"></div>
      <div class="brand-copy"><b>AI Companion</b><span>Your personal AI space</span></div>
    </div>

    <button class="new-chat" id="newChat"><span class="plus">＋</span><span>New chat</span><kbd>⌘ N</kbd></button>

    <nav class="main-nav">
      <button onclick="location.href='pages/library.html'"><span class="nav-icon">▦</span><span>Library</span></button>
      <button onclick="location.href='pages/projects.html'"><span class="nav-icon">◇</span><span>Projects</span></button>
      <button onclick="location.href='pages/scheduled.html'"><span class="nav-icon">◷</span><span>Scheduled</span></button>
      <button onclick="location.href='pages/coding.html'"><span class="nav-icon">⌘</span><span>Coding</span></button>
    </nav>

    <div class="recent-head"><span>RECENT</span><button id="clearHistory">Clear</button></div>
    <div class="history-tools"><span>⌕</span><input id="historySearch" type="search" placeholder="Search conversations..."></div>
    <div id="history" class="history"></div>

    <div class="sidebar-bottom">
      <button id="exportBtn" class="export-chat"><span>⇩</span> Export chat</button>
      <button class="sidebar-profile" id="sidebarProfile">
        <span class="sidebar-profile-avatar"><span id="sidebarAvatarText">AI</span><img id="sidebarAvatarImage" alt=""></span>
        <span class="sidebar-profile-info"><b id="sidebarProfileName">AI User</b><small>Personal account</small></span>
        <span class="sidebar-profile-more">•••</span>
      </button>
      <div class="profile-popover" id="profilePopover">
        <div class="popover-user"><div class="popover-avatar" id="popoverAvatar">AI</div><div><b id="popoverName">AI User</b><small>Account</small></div></div>
        <button onclick="location.href='pages/profile.html'">👤 Profile</button>
        <button onclick="location.href='pages/settings.html'">⚙ Settings</button>
        <button onclick="location.href='pages/upgrade.html'">✦ Upgrade plan</button>
        <button onclick="location.href='pages/help.html'">❔ Help</button>
        <button id="sidebarAuth">↪ Log in</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="mobile-left"><button class="mobile-menu" id="mobileMenu">☰</button><div class="mobile-brand"><img src="assets/logo.svg" alt="">AI Companion</div></div>
      <div class="top-actions">
        <span class="status"><i></i> Online</span>
        <button id="personaBtn" class="persona"><span>✦</span> Friendly <b>⌄</b></button>
        <button class="avatar" id="profileBtn" title="Profile"><span id="avatarText">AI</span><img id="avatarImage" src="assets/logo.svg" alt="AI Companion"></button>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="hero-mark"><div class="hero-ring"></div><img src="assets/logo.svg" alt="AI Companion"></div>
        <div class="eyebrow">YOUR PERSONAL AI</div>
        <h1>Meet your <span>AI Companion</span></h1>
        <p>Talk, create, learn, plan, or simply have a conversation.</p>

        <div class="suggestions">
          <button data-msg="Help me plan my day"><span class="card-icon sun">☼</span><span><b>Plan my day</b><small>Organize your tasks and priorities</small></span><em>↗</em></button>
          <button data-msg="Give me a creative idea"><span class="card-icon spark">✦</span><span><b>Get creative</b><small>Ideas, stories, designs and more</small></span><em>↗</em></button>
          <button data-msg="Teach me something interesting"><span class="card-icon learn">◈</span><span><b>Teach me</b><small>Learn something new today</small></span><em>↗</em></button>
          <button data-msg="Help me write something"><span class="card-icon write">✎</span><span><b>Help me write</b><small>Turn your thoughts into words</small></span><em>↗</em></button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div id="filePreview" class="file-preview"></div>
      <div class="composer">
        <button class="icon-btn" id="attach" title="Attach">＋</button>
        <input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.doc,.docx">
        <textarea id="message" rows="1" placeholder="Message your AI Companion..." autocomplete="off"></textarea>
        <div class="composer-actions">
          <button class="voice-btn" id="voice" title="Voice"><span class="voice-glow"></span><span class="mic-icon"></span></button>
          <button class="send" id="send" title="Send">↑</button>
        </div>
      </div>
      <div class="voice-status" id="voiceStatus"></div>
      <div class="hint">Enter to send&nbsp;&nbsp;•&nbsp;&nbsp;Shift + Enter for a new line&nbsp;&nbsp;•&nbsp;&nbsp;Ctrl/Cmd + K to search</div>
    </div>
  </main>
</div>

<div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal">×</button><h2>AI Companion Settings</h2><label>Personality<select id="persona"><option>Friendly</option><option>Professional</option><option>Tutor</option><option>Creative</option><option>Coding</option></select></label><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="amoled">AMOLED</option></select></label><button class="primary" id="saveSettings">Save settings</button></div></div>
<script src="script.js"></script>
</body>
</html>
