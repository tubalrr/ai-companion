iv class="modal-card"><button class="close" id="closeModal">×</button><h2>AI Companion Settings</h2><label>Personality<select id="persona"><option>Friendly</option><option>Professional</option><option>Tutor</option><option>Creative</option><option>Coding</option></select></label><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="amoled">AMOLED</option></select></label><button class="primary" id="saveSettings">Save settings</button></div></div><script src="script.js"></script></body></html>
