<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Companion</title><link rel="stylesheet" href="style.css"></head><body><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><b>AI Companion</b><small>Your personal AI space</small></div></div><button class="new-chat" id="newChat">＋ New chat</button><div class="side-title">RECENT</div><div id="history" class="history"></div><div class="sidebar-bottom"><button>⚙ Settings</button><button>◐ Appearance</button></div></aside><main class="main"><header class="topbar"><div class="mobile-brand">✦ AI Companion</div><div class="status"><span></span> Online</div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><div class="ai-avatar">✦</div><h1>Meet your AI Companion</h1><p>Talk, create, learn, plan, or simply have a conversation.</p><div class="suggestions"><button data-msg="Help me plan my day">☀ Plan my day</button><button data-msg="Give me a creative idea">✦ Get creative</button><button data-msg="Teach me something interesting">◈ Teach me</button><button data-msg="Let's have a conversation">💬 Let's talk</button></div></div></section><div class="composer-wrap"><div class="composer"><button class="icon-btn">＋</button><input id="message" placeholder="Message your AI Companion..." autocomplete="off"><button class="icon-btn" id="voice">⌕</button><button class="send" id="send">➤</button></div><div class="hint">AI Companion can make mistakes. Check important information.</div></div></main></div><script src="script.js"></script></body></html>
